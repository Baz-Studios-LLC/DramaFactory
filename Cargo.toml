[package]
name = "dramafactory"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
directories = "6"
anyhow = "1"
ureq = { version = "3.5.1", features = ["json"] }
