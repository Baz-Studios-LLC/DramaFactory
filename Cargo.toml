[package]
name = "dramafactory"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = "0.33"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
directories = "6"
anyhow = "1"
ureq = { version = "3.5.1", features = ["json"] }
fs2 = "0.4.3"
sha2 = "0.11.1"
rfd = "0.18.0"
egui_extras = { version = "0.33", features = ["file", "image", "webp"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
ed25519-dalek = { version = "2", features = ["std"] }
libc = "0.2.191"
hound = "3.5.1"
plist = "1.10.3"
url = "2.5.8"
base64 = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
